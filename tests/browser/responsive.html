<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>POLARIS responsive QA fixture</title>
  <style>
    body {
      margin: 20px;
      font: 16px system-ui;
      background: #e7eef4;
      color: #152737;
    }
    main {
      display: flex;
      gap: 24px;
      align-items: start;
      flex-wrap: wrap;
    }
    iframe {
      display: block;
      border: 1px solid #526779;
      background: white;
    }
  </style>
  <h1>Responsive layout checks</h1>
  <p>
    Browser viewports at 390 and 768 CSS pixels. This checks layout, not device
    hardware or mobile browser behaviour.
  </p>
  <main>
    <section>
      <h2>390 px · station overview</h2>
      <iframe
        title="Phone width"
        width="390"
        height="844"
        src="/stations/maitri/overview?browser-demo=1&amp;mode=demo"
      ></iframe>
    </section>
    <section>
      <h2>768 px · scientific workspace</h2>
      <iframe
        title="Tablet width"
        width="768"
        height="900"
        src="/stations/maitri/research?browser-demo=1&amp;mode=demo"
      ></iframe>
    </section>
  </main>
</html>
